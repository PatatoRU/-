services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuda}
      POSTGRES_USER: ${POSTGRES_USER:-kuda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuda}"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  bot:
    build: .
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    command: sh -c "alembic upgrade head && python -m app.main"
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    command: sh -c "alembic upgrade head && uvicorn app.web.main:app --host 0.0.0.0 --port 8000"
