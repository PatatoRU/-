[project]
name = "kuda-segodnya-bot"
version = "0.1.0"
description = "Telegram bot Куда Сегодня"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.6,<4",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "SQLAlchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.19",
  "alembic>=1.13",
  "redis>=5.0",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fakeredis>=2.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
